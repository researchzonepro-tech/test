<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d09">
  <title>Checkout - Nairafunded</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #080d09;
      --accent: #39FF14;
      --dark-green: #008F11;
      --white: #ffffff;
      --text: #e5e5e5;
      --muted: #9ca3af;
      --input-bg: #111a13;
      --border: #263b29;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--primary);
      color: var(--white);
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 14px;
    }

    .form-container {
      width: 100%;
      max-width: 440px;
      background: #0d150f;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin: auto;
      box-shadow: 0 0 25px rgba(57, 255, 20, 0.07);
    }

    .logo {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo h1 {
      font-size: 27px;
      font-weight: 700;
      color: var(--white);
    }

    .logo h1 span {
      color: var(--accent);
    }

    .logo p {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      margin: 18px 0 12px;
      color: var(--accent);
    }

    .plan-summary {
      background: #111d13;
      border: 1px solid var(--dark-green);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .plan-summary small {
      color: var(--muted);
      font-size: 11px;
    }

    .plan-summary h2 {
      font-size: 21px;
      margin-top: 4px;
    }

    .plan-summary .price {
      color: var(--accent);
      font-size: 19px;
      font-weight: 700;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 7px;
      color: var(--text);
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--input-bg);
      color: var(--white);
      outline: none;
      font-family: inherit;
      font-size: 13px;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
    }

    select option {
      background: #111a13;
      color: white;
    }

    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Fixed Nigerian phone number */

    .phone-group {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
      background: var(--input-bg);
    }

    .phone-prefix {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      background: #17251a;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      border-right: 1px solid var(--border);
    }

    .phone-group input {
      border: none;
      border-radius: 0;
      background: transparent;
    }

    .phone-group:focus-within {
      border-color: var(--accent);
    }

    /* Password */

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 48px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      background: none;
      border: none;
      font-family: inherit;
    }

    /* Payment methods */

    .payment-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .payment-option {
      position: relative;
    }

    .payment-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }

    .payment-card {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px;
      min-height: 72px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--input-bg);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .payment-card:hover {
      border-color: var(--dark-green);
    }

    .payment-option input:checked + .payment-card {
      border: 1.5px solid var(--accent);
      background: rgba(57, 255, 20, 0.07);
      box-shadow: 0 0 12px rgba(57, 255, 20, 0.08);
    }

    .payment-logo {
      width: 43px;
      height: 43px;
      object-fit: contain;
      border-radius: 8px;
      background: white;
      padding: 5px;
      flex-shrink: 0;
    }

    .bank-icon {
      width: 43px;
      height: 43px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #17351c;
      color: var(--accent);
      font-size: 23px;
      flex-shrink: 0;
    }

    .payment-info {
      flex: 1;
    }

    .payment-info strong {
      display: block;
      font-size: 13px;
      font-weight: 600;
    }

    .payment-info small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 3px;
    }

    .radio-indicator {
      width: 19px;
      height: 19px;
      border: 1.5px solid #667267;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .payment-option input:checked + .payment-card .radio-indicator {
      border-color: var(--accent);
    }

    .payment-option input:checked + .payment-card .radio-indicator::after {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
    }

    .payment-option input:focus-visible + .payment-card {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Submit */

    .submit-btn {
      width: 100%;
      border: none;
      padding: 14px;
      margin-top: 17px;
      border-radius: 9px;
      background: var(--accent);
      color: #071008;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .submit-btn:hover {
      background: #2ddd0d;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secure-note {
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      margin-top: 14px;
    }

    .back-link {
      display: block;
      text-align: center;
      color: var(--accent);
      font-size: 12px;
      text-decoration: none;
      margin-top: 15px;
    }

    .error-message {
      display: none;
      background: #351515;
      border: 1px solid #8d2929;
      color: #ffbaba;
      padding: 11px;
      font-size: 11px;
      border-radius: 8px;
      margin-bottom: 13px;
    }

    @media (max-width: 360px) {
      .form-container {
        padding: 16px;
      }

      .name-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .payment-card {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <main class="form-container">

    <div class="logo">
      <h1>NAIRA<span>FUNDED</span></h1>
      <p>YOUR TRADING JOURNEY STARTS HERE</p>
    </div>

    <div class="plan-summary">
      <small>YOUR SELECTED CHALLENGE</small>
      <h2 id="planName">Loading plan...</h2>
      <div class="price" id="planPrice">₦0</div>
    </div>

    <div id="errorMessage" class="error-message" role="alert"></div>

    <form id="checkoutForm">

      <h3 class="section-title">Personal Information</h3>

      <div class="name-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName"
            placeholder="First name" autocomplete="given-name" required>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName"
            placeholder="Last name" autocomplete="family-name" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
          placeholder="example@email.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="state">State</label>
        <select id="state" name="state" required>
          <option value="">Select your state</option>
          <option>Abia</option>
          <option>Adamawa</option>
          <option>Akwa Ibom</option>
          <option>Anambra</option>
          <option>Bauchi</option>
          <option>Bayelsa</option>
          <option>Benue</option>
          <option>Borno</option>
          <option>Cross River</option>
          <option>Delta</option>
          <option>Ebonyi</option>
          <option>Edo</option>
          <option>Ekiti</option>
          <option>Enugu</option>
          <option>Gombe</option>
          <option>Imo</option>
          <option>Jigawa</option>
          <option>Kaduna</option>
          <option>Kano</option>
          <option>Katsina</option>
          <option>Kebbi</option>
          <option>Kogi</option>
          <option>Kwara</option>
          <option>Lagos</option>
          <option>Nasarawa</option>
          <option>Niger</option>
          <option>Ogun</option>
          <option>Ondo</option>
          <option>Osun</option>
          <option>Oyo</option>
          <option>Plateau</option>
          <option>Rivers</option>
          <option>Sokoto</option>
          <option>Taraba</option>
          <option>Yobe</option>
          <option>Zamfara</option>
          <option>FCT Abuja</option>
        </select>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <div class="phone-group">
          <span class="phone-prefix">🇳🇬 +234</span>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="8012345678"
            inputmode="numeric"
            autocomplete="tel-national"
            maxlength="11"
            required
          >
        </div>
      </div>

      <h3 class="section-title">Trading Information</h3>

      <div class="form-group">
        <label for="platform">Trading Platform</label>
        <select id="platform" name="platform" required>
          <option value="">Select trading platform</option>
          <option value="MetaTrader 5">MetaTrader 5</option>
          <option value="MetaTrader 4">MetaTrader 4</option>
          <option value="MatchTrader">MatchTrader</option>
        </select>
      </div>

      <h3 class="section-title">Payment Method</h3>

      <div class="payment-options">

        <div class="payment-option">
          <input
            type="radio"
            id="bankTransfer"
            name="paymentMethod"
            value="bank_transfer"
            required
          >
          <label class="payment-card" for="bankTransfer">
            <span class="bank-icon">▤</span>
            <span class="payment-info">
              <strong>Bank Transfer</strong>
              <small>Pay directly from your bank app</small>
            </span>
            <span class="radio-indicator"></span>
          </label>
        </div>

        <div class="payment-option">
          <input
            type="radio"
            id="moniepoint"
            name="paymentMethod"
            value="moniepoint"
            required
          >
          <label class="payment-card" for="moniepoint">
            <img
              class="payment-logo"
              src="https://moniepoint.com/icon.svg"
              alt="Moniepoint logo"
            >
            <span class="payment-info">
              <strong>Moniepoint</strong>
              <small>Pay using Moniepoint</small>
            </span>
            <span class="radio-indicator"></span>
          </label>
        </div>

        <div class="payment-option">
          <input
            type="radio"
            id="opay"
            name="paymentMethod"
            value="opay"
            required
          >
          <label class="payment-card" for="opay">
            <img
              class="payment-logo"
              src="https://gstatic.opayweb.com/website-ng/img/opay-logo.684aa98.svg"
              alt="OPay logo"
            >
            <span class="payment-info">
              <strong>OPay</strong>
              <small>Pay using OPay</small>
            </span>
            <span class="radio-indicator"></span>
          </label>
        </div>

      </div>

      <h3 class="section-title">Account Security</h3>

      <div class="form-group">
        <label for="password">Create Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password"
            placeholder="Minimum 8 characters" minlength="8"
            autocomplete="new-password" required>
          <button type="button" class="toggle-password"
            onclick="togglePassword('password', this)">Show</button>
        </div>
      </div>

      <div class="form-group">
        <label for="retypePassword">Confirm Password</label>
        <div class="password-wrap">
          <input type="password" id="retypePassword"
            name="retypePassword" placeholder="Confirm your password"
            autocomplete="new-password" required>
          <button type="button" class="toggle-password"
            onclick="togglePassword('retypePassword', this)">Show</button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        Continue to Payment
      </button>

      <p class="secure-note">
        🔒 Your information is submitted securely.
      </p>

    </form>

    <a href="main.html" class="back-link">← Back to Homepage</a>

  </main>

  <script>
    const plans = {
      "50K Plan": 5000,
      "100K Plan": 8000,
      "200K Plan": 12000,
      "500K Plan": 28000,
      "1M Plan": 50000
    };

    const params = new URLSearchParams(window.location.search);
    const selectedPlan = params.get("plan");
    const selectedPrice = params.get("price");

    const planName = document.getElementById("planName");
    const planPrice = document.getElementById("planPrice");
    const form = document.getElementById("checkoutForm");
    const errorMessage = document.getElementById("errorMessage");
    const submitBtn = document.getElementById("submitBtn");
    const phoneInput = document.getElementById("phone");

    const validPlan =
      Object.prototype.hasOwnProperty.call(plans, selectedPlan) &&
      Number(selectedPrice) === plans[selectedPlan];

    if (validPlan) {
      planName.textContent = selectedPlan;
      planPrice.textContent =
        "₦" + plans[selectedPlan].toLocaleString("en-NG");
    } else {
      planName.textContent = "Invalid plan";
      planPrice.textContent = "₦0";
      showError("Invalid plan selection. Please return to the homepage and select a valid plan.");
      submitBtn.disabled = true;
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = "block";
      errorMessage.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }

    function togglePassword(id, button) {
      const input = document.getElementById(id);

      if (input.type === "password") {
        input.type = "text";
        button.textContent = "Hide";
      } else {
        input.type = "password";
        button.textContent = "Show";
      }
    }

    // Accept digits only in Nigerian phone input.
    phoneInput.addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "").slice(0, 11);
    });

    function getNigerianPhoneNumber() {
      let number = phoneInput.value.replace(/\D/g, "");

      if (number.startsWith("0")) {
        number = number.substring(1);
      }

      if (!/^[789][01]\d{8}$/.test(number)) {
        return null;
      }

      return "+234" + number;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      errorMessage.style.display = "none";

      if (!validPlan) {
        showError("Please select a valid plan from the homepage.");
        return;
      }

      const fields = form.querySelectorAll(
        "input:not([type=hidden]):not([type=radio]), select"
      );

      for (const field of fields) {
        if (!field.value.trim()) {
          showError("Please complete all required fields.");
          field.focus();
          return;
        }
      }

      const email = form.elements.email.value.trim();

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!emailPattern.test(email)) {
        showError("Please enter a valid email address.");
        form.elements.email.focus();
        return;
      }

      const phoneNumber = getNigerianPhoneNumber();

      if (!phoneNumber) {
        showError("Enter a valid Nigerian phone number, e.g. 08012345678.");
        phoneInput.focus();
        return;
      }

      const password = form.elements.password.value;
      const confirmPassword = form.elements.retypePassword.value;

      if (password.length < 8) {
        showError("Password must contain at least 8 characters.");
        form.elements.password.focus();
        return;
      }

      if (password !== confirmPassword) {
        showError("Your passwords do not match.");
        form.elements.retypePassword.focus();
        return;
      }

      const selectedPayment = form.querySelector(
        'input[name="paymentMethod"]:checked'
      );

      if (!selectedPayment) {
        showError("Please select a payment method.");
        return;
      }

      const customerData = {
        firstName: form.elements.firstName.value.trim(),
        lastName: form.elements.lastName.value.trim(),
        email: email,
        state: form.elements.state.value,
        phone: phoneNumber,
        platform: form.elements.platform.value,
        paymentMethod: selectedPayment.value,
        plan: selectedPlan,
        price: plans[selectedPlan]
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "Processing...";

      try {
        const response = await fetch("/api/create-checkout", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(customerData)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.message || "Unable to create checkout. Please try again."
          );
        }

        if (!result.paymentUrl) {
          throw new Error("Payment link was not returned by the server.");
        }

        const paymentUrl = new URL(result.paymentUrl, window.location.origin);

        if (paymentUrl.origin !== window.location.origin) {
          throw new Error("Invalid payment destination.");
        }

        window.location.href = paymentUrl.href;

      } catch (error) {
        showError(error.message || "Something went wrong. Please try again.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Continue to Payment";
      }
    });
  </script>

</body>
  </html>
