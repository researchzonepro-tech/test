<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d09">
  <title>Checkout - Nairafunded</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --primary: #080d09;
      --accent: #39FF14;
      --dark-green: #008F11;
      --white: #ffffff;
      --text: #e5e5e5;
      --input-bg: #111a13;
      --border: #263b29;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      min-height: 100%;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--primary);
      color: var(--white);
      font-family: 'Poppins', Arial, sans-serif;
      padding: 14px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    .form-container {
      width: 100%;
      max-width: 420px;
      background: #101711;
      padding: 19px;
      margin: auto;
      border-radius: 13px;
      border: 1px solid rgba(57,255,20,0.2);
      box-shadow: 0 0 25px rgba(57,255,20,0.07);
    }

    .brand {
      text-align: center;
      margin-bottom: 17px;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.3;
    }

    .brand .naira {
      color: white;
    }

    .brand .funded {
      color: var(--accent);
    }

    .brand-subtitle {
      text-align: center;
      color: #999;
      font-size: 9px;
      letter-spacing: 1.6px;
      margin-top: -13px;
      margin-bottom: 16px;
    }

    .plan-summary {
      background: #111f14;
      border: 1px solid var(--dark-green);
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 13px;
      text-align: center;
    }

    .plan-summary h3 {
      color: var(--accent);
      margin-bottom: 4px;
      font-size: 17px;
    }

    .plan-price {
      font-size: 23px;
      font-weight: bold;
      color: white;
    }

    .form-label {
      display: block;
      color: #ddd;
      font-size: 11px;
      margin-top: 7px;
    }

    input, select {
      display: block;
      width: 100%;
      min-width: 0;
      height: 42px;
      padding: 9px 11px;
      margin: 5px 0 7px;
      background: var(--input-bg);
      color: white;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: .2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 7px rgba(57,255,20,.12);
    }

    input::placeholder {
      color: #999;
    }

    select option {
      background: #111a13;
      color: white;
    }

    /* Fixed Nigerian phone code */
    .phone-group {
      display: flex;
      width: 100%;
      height: 42px;
      margin: 5px 0 7px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--input-bg);
      overflow: hidden;
      transition: .2s;
    }

    .phone-group:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 7px rgba(57,255,20,.12);
    }

    .phone-prefix {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0 12px;
      background: #19291b;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      border-right: 1px solid var(--border);
    }

    .phone-group input {
      flex: 1;
      width: 100%;
      min-width: 0;
      height: 100%;
      margin: 0;
      padding: 9px 10px;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .phone-group input:focus {
      border: none;
      box-shadow: none;
    }

    .phone-group.error {
      border-color: #ff4b4b;
    }

    .input-group {
      position: relative;
    }

    .input-group input {
      padding-right: 42px;
    }

    .toggle-password {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--accent);
      z-index: 2;
    }

    input.error, select.error {
      border-color: #ff4b4b !important;
    }

    /* Payment dropdown - same dimensions as original select */

    .payment-dropdown {
      position: relative;
      width: 100%;
      margin: 5px 0 7px;
    }

    .payment-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 42px;
      padding: 0 11px;
      background: var(--input-bg);
      color: white;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      outline: none;
      transition: .2s;
    }

    .payment-trigger:focus,
    .payment-trigger.open {
      border-color: var(--accent);
      box-shadow: 0 0 7px rgba(57,255,20,.12);
    }

    .payment-trigger.error {
      border-color: #ff4b4b;
    }

    .payment-selected {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .payment-selected img {
      width: 25px;
      height: 25px;
      object-fit: contain;
      border-radius: 5px;
      background: white;
      padding: 2px;
    }

    .payment-selected .bank-symbol {
      width: 25px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #19291b;
      color: var(--accent);
      border-radius: 5px;
      font-size: 15px;
    }

    .payment-arrow {
      color: var(--accent);
      font-size: 12px;
      transition: transform .2s;
    }

    .payment-trigger.open .payment-arrow {
      transform: rotate(180deg);
    }

    .payment-menu {
      display: none;
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      width: 100%;
      background: #111a13;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      z-index: 20;
      box-shadow: 0 8px 20px rgba(0,0,0,.4);
    }

    .payment-menu.show {
      display: block;
    }

    .payment-option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 46px;
      padding: 8px 11px;
      color: white;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(38,59,41,.7);
      font-family: inherit;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
    }

    .payment-option:last-child {
      border-bottom: none;
    }

    .payment-option:hover,
    .payment-option:focus {
      background: #19291b;
      outline: none;
    }

    .payment-option.selected {
      background: rgba(57,255,20,.08);
      color: var(--accent);
    }

    .payment-option img {
      width: 29px;
      height: 29px;
      object-fit: contain;
      background: white;
      border-radius: 5px;
      padding: 3px;
      flex-shrink: 0;
    }

    .payment-option .bank-symbol {
      width: 29px;
      height: 29px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #19291b;
      color: var(--accent);
      border-radius: 5px;
      font-size: 17px;
      flex-shrink: 0;
    }

    .payment-option .option-check {
      margin-left: auto;
      color: var(--accent);
      display: none;
    }

    .payment-option.selected .option-check {
      display: inline-block;
    }

    .submit-btn {
      width: 100%;
      min-height: 44px;
      padding: 10px;
      margin-top: 12px;
      background: linear-gradient(45deg, var(--dark-green), var(--accent));
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: .2s;
    }

    .submit-btn:hover {
      box-shadow: 0 0 15px rgba(57,255,20,.25);
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 10px;
      margin-top: 10px;
      border-radius: 7px;
      font-size: 12px;
    }

    .message.error-message {
      display: block;
      background: #4a2020;
      color: #ffbaba;
    }

    .secure-note {
      text-align: center;
      font-size: 10px;
      color: #aaa;
      margin-top: 11px;
      line-height: 1.5;
    }

    .secure-note i {
      color: var(--accent);
      margin-right: 5px;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      color: var(--accent);
      font-size: 11px;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* Narrow phones */
    @media (max-width: 380px) {
      body {
        padding: 9px;
      }

      .form-container {
        padding: 14px;
        border-radius: 11px;
      }

      .brand {
        font-size: 22px;
        margin-bottom: 15px;
      }

      .plan-summary {
        padding: 10px;
        margin-bottom: 10px;
      }

      .plan-price {
        font-size: 21px;
      }

      input, select, .phone-group {
        height: 40px;
        font-size: 12px;
      }

      .phone-group input {
        height: 100%;
      }

      .phone-prefix {
        font-size: 12px;
        padding: 0 9px;
      }

      .form-label {
        font-size: 10px;
      }

      .payment-trigger {
        height: 40px;
        font-size: 12px;
      }
    }

    /* Short screens */
    @media (max-height: 700px) {
      body {
        padding-top: 8px;
        padding-bottom: 8px;
      }

      .form-container {
        padding-top: 13px;
        padding-bottom: 13px;
        margin-top: 0;
        margin-bottom: 0;
      }

      .brand {
        font-size: 22px;
        margin-bottom: 13px;
      }

      .brand-subtitle {
        margin-bottom: 12px;
      }

      .plan-summary {
        padding: 9px;
        margin-bottom: 9px;
      }

      .form-label {
        margin-top: 5px;
      }

      input, select, .phone-group {
        height: 39px;
        margin-top: 4px;
        margin-bottom: 5px;
      }

      .phone-group input {
        height: 100%;
        margin: 0;
      }

      .payment-trigger {
        height: 39px;
        margin-top: 4px;
        margin-bottom: 5px;
      }

      .submit-btn {
        margin-top: 9px;
      }

      .secure-note {
        margin-top: 8px;
      }

      .back-link {
        margin-top: 9px;
      }
    }
  </style>
</head>

<body>

<div class="form-container">

  <div class="brand">
    <span class="naira">Naira</span><span class="funded">funded</span>
  </div>

  <p class="brand-subtitle">TRADE • GROW • GET FUNDED</p>

  <div class="plan-summary">
    <h3 id="planTitle">Selected Plan</h3>
    <p class="plan-price" id="planPrice">Loading price...</p>
  </div>

  <form id="checkoutForm" novalidate>

    <label class="form-label">First Name</label>
    <input type="text" name="firstName"
      placeholder="Enter first name"
      autocomplete="given-name" required>

    <label class="form-label">Last Name</label>
    <input type="text" name="lastName"
      placeholder="Enter last name"
      autocomplete="family-name" required>

    <label class="form-label">Email Address</label>
    <input type="email" name="email"
      placeholder="Enter email address"
      autocomplete="email" required>

    <label class="form-label">State of Residence</label>
    <select id="state" name="state" required>
      <option value="">Select Your State</option>
      <option value="Abia">Abia</option>
      <option value="Adamawa">Adamawa</option>
      <option value="Akwa Ibom">Akwa Ibom</option>
      <option value="Anambra">Anambra</option>
      <option value="Bauchi">Bauchi</option>
      <option value="Bayelsa">Bayelsa</option>
      <option value="Benue">Benue</option>
      <option value="Borno">Borno</option>
      <option value="Cross River">Cross River</option>
      <option value="Delta">Delta</option>
      <option value="Ebonyi">Ebonyi</option>
      <option value="Edo">Edo</option>
      <option value="Ekiti">Ekiti</option>
      <option value="Enugu">Enugu</option>
      <option value="Gombe">Gombe</option>
      <option value="Imo">Imo</option>
      <option value="Jigawa">Jigawa</option>
      <option value="Kaduna">Kaduna</option>
      <option value="Kano">Kano</option>
      <option value="Katsina">Katsina</option>
      <option value="Kebbi">Kebbi</option>
      <option value="Kogi">Kogi</option>
      <option value="Kwara">Kwara</option>
      <option value="Lagos">Lagos</option>
      <option value="Nasarawa">Nasarawa</option>
      <option value="Niger">Niger</option>
      <option value="Ogun">Ogun</option>
      <option value="Ondo">Ondo</option>
      <option value="Osun">Osun</option>
      <option value="Oyo">Oyo</option>
      <option value="Plateau">Plateau</option>
      <option value="Rivers">Rivers</option>
      <option value="Sokoto">Sokoto</option>
      <option value="Taraba">Taraba</option>
      <option value="Yobe">Yobe</option>
      <option value="Zamfara">Zamfara</option>
      <option value="FCT Abuja">Federal Capital Territory (Abuja)</option>
    </select>

    <label class="form-label">Phone Number</label>
    <div class="phone-group" id="phoneGroup">
      <span class="phone-prefix">🇳🇬 +234</span>
      <input
        id="phone"
        type="tel"
        name="phone"
        placeholder="8012345678"
        inputmode="numeric"
        autocomplete="tel-national"
        maxlength="11"
        required
      >
    </div>

    <label class="form-label">Trading Platform</label>
    <select id="platform" name="platform" required>
      <option value="">Select Platform</option>
      <option value="metatrader5">MetaTrader 5</option>
      <option value="metatrader4">MetaTrader 4</option>
      <option value="marchtrader">MarchTrader</option>
    </select>

    <!-- Payment Method Dropdown -->
    <label class="form-label">Payment Method</label>

    <div class="payment-dropdown" id="paymentDropdown">

      <input type="hidden" id="paymentMethod" name="paymentMethod" value="">

      <button
        type="button"
        class="payment-trigger"
        id="paymentTrigger"
        aria-haspopup="listbox"
        aria-expanded="false"
      >
        <span class="payment-selected" id="paymentSelected">
          <span style="color:#999;">Select Payment Method</span>
        </span>
        <i class="fa-solid fa-chevron-down payment-arrow"></i>
      </button>

      <div class="payment-menu" id="paymentMenu" role="listbox">

        <button
          type="button"
          class="payment-option"
          data-value="bank_transfer"
          role="option"
          aria-selected="false"
        >
          <span class="bank-symbol">
            <i class="fa-solid fa-building-columns"></i>
          </span>
          <span>Bank Transfer</span>
          <i class="fa-solid fa-check option-check"></i>
        </button>

        <button
          type="button"
          class="payment-option"
          data-value="moniepoint"
          role="option"
          aria-selected="false"
        >
          <img
            src="https://moniepoint.com/icon.svg"
            alt="Moniepoint logo"
          >
          <span>Moniepoint</span>
          <i class="fa-solid fa-check option-check"></i>
        </button>

        <button
          type="button"
          class="payment-option"
          data-value="opay"
          role="option"
          aria-selected="false"
        >
          <img
            src="https://gstatic.opayweb.com/website-ng/img/opay-logo.684aa98.svg"
            alt="OPay logo"
          >
          <span>OPay</span>
          <i class="fa-solid fa-check option-check"></i>
        </button>

      </div>
    </div>

    <label class="form-label">Create Password</label>
    <div class="input-group">
      <input type="password" name="password" id="password"
        placeholder="Create password (minimum 8 characters)"
        minlength="8" autocomplete="new-password" required>
      <i class="fa-solid fa-eye toggle-password"
        onclick="togglePassword('password', this)"></i>
    </div>

    <label class="form-label">Confirm Password</label>
    <div class="input-group">
      <input type="password" name="retypePassword" id="retypePassword"
        placeholder="Confirm your password"
        minlength="8" autocomplete="new-password" required>
      <i class="fa-solid fa-eye toggle-password"
        onclick="togglePassword('retypePassword', this)"></i>
    </div>

    <div id="message" class="message"></div>

    <button type="submit" class="submit-btn" id="submitBtn">
      Continue to Payment
    </button>

    <p class="secure-note">
      <i class="fa-solid fa-lock"></i>
      Your information should be securely processed.
    </p>

    <a href="index.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Homepage
    </a>

  </form>
</div>

<script>
  // Available plans
  const plans = {
    "50K Plan": 5000,
    "100K Plan": 8000,
    "200K Plan": 12000,
    "500K Plan": 28000,
    "1M Plan": 50000
  };

  const params = new URLSearchParams(window.location.search);
  const plan = params.get("plan");

  const planTitle = document.getElementById("planTitle");
  const planPrice = document.getElementById("planPrice");
  const form = document.getElementById("checkoutForm");
  const message = document.getElementById("message");
  const submitBtn = document.getElementById("submitBtn");

  const validPlan = Object.prototype.hasOwnProperty.call(plans, plan);

  if (!validPlan) {
    planTitle.textContent = "Invalid Plan";
    planPrice.textContent = "Please select a valid plan.";
    submitBtn.disabled = true;
  } else {
    planTitle.textContent = plan;
    planPrice.textContent = "₦" + plans[plan].toLocaleString("en-NG");
  }

  const phoneInput = document.getElementById("phone");
  const phoneGroup = document.getElementById("phoneGroup");

  // Payment dropdown
  const paymentDropdown = document.getElementById("paymentDropdown");
  const paymentTrigger = document.getElementById("paymentTrigger");
  const paymentMenu = document.getElementById("paymentMenu");
  const paymentSelected = document.getElementById("paymentSelected");
  const paymentInput = document.getElementById("paymentMethod");
  const paymentOptions = document.querySelectorAll(".payment-option");

  const paymentDisplay = {
    bank_transfer: `
      <span class="bank-symbol">
        <i class="fa-solid fa-building-columns"></i>
      </span>
      <span>Bank Transfer</span>
    `,
    moniepoint: `
      <img src="https://moniepoint.com/icon.svg" alt="Moniepoint logo">
      <span>Moniepoint</span>
    `,
    opay: `
      <img src="https://gstatic.opayweb.com/website-ng/img/opay-logo.684aa98.svg" alt="OPay logo">
      <span>OPay</span>
    `
  };

  function closePaymentDropdown() {
    paymentMenu.classList.remove("show");
    paymentTrigger.classList.remove("open");
    paymentTrigger.setAttribute("aria-expanded", "false");
  }

  paymentTrigger.addEventListener("click", function() {
    const isOpen = paymentMenu.classList.contains("show");

    if (isOpen) {
      closePaymentDropdown();
    } else {
      paymentMenu.classList.add("show");
      paymentTrigger.classList.add("open");
      paymentTrigger.setAttribute("aria-expanded", "true");
    }
  });

  paymentOptions.forEach(option => {
    option.addEventListener("click", function() {
      const value = this.dataset.value;

      paymentInput.value = value;
      paymentSelected.innerHTML = paymentDisplay[value];

      paymentOptions.forEach(item => {
        item.classList.remove("selected");
        item.setAttribute("aria-selected", "false");
      });

      this.classList.add("selected");
      this.setAttribute("aria-selected", "true");

      paymentTrigger.classList.remove("error");
      closePaymentDropdown();
      message.className = "message";
      message.textContent = "";
    });
  });

  // Close dropdown when clicking outside.
  document.addEventListener("click", function(event) {
    if (!paymentDropdown.contains(event.target)) {
      closePaymentDropdown();
    }
  });

  // Allow Escape key to close dropdown.
  document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
      closePaymentDropdown();
    }
  });
  // Allow only numbers in the phone field.
  phoneInput.addEventListener("input", function() {
    this.value = this.value.replace(/\D/g, "").slice(0, 11);
    phoneGroup.classList.remove("error");
  });

  // Clear field errors when edited.
  form.querySelectorAll("input, select").forEach(field => {
    field.addEventListener("input", () => {
      field.classList.remove("error");
      message.className = "message";
      message.textContent = "";
    });

    field.addEventListener("change", () => {field.classList.remove("error");
      message.className = "message";
      message.textContent = "";
    });
  });

  // Password visibility.
  function togglePassword(id, icon) {
    const input = document.getElementById(id);

    input.type = input.type === "password" ? "text" : "password";

    icon.classList.toggle("fa-eye");
    icon.classList.toggle("fa-eye-slash");
  }

  // Display error.
  function showError(text) {
    message.textContent = text;
    message.className = "message error-message";
  }

  // Validate Nigerian phone number and convert to +234 format.
  function getNigerianPhoneNumber() {
    let number = phoneInput.value.replace(/\D/g, "");

    if (number.startsWith("0")) {
      number = number.substring(1);
    }

    const validNigerianNumber = /^[789][01]\d{8}$/.test(number);

    if (!validNigerianNumber) {
      return null;
    }

    return "+234" + number;
  }

  // Submit checkout form.
  form.addEventListener("submit", async function(event) {
    event.preventDefault();
    message.className = "message";
    message.textContent = "";

    if (!validPlan) {
      showError("Invalid plan. Please select a plan again.");
      return;
    }

    let valid = true;

    const fields = form.querySelectorAll(
      "input:not([type=hidden]), select"
    );

    fields.forEach(field => {
      if (!field.value.trim()) {
        field.classList.add("error");
        valid = false;
      } else {field.classList.remove("error");
      }
    });

    if (!valid) {
      showError("Please complete all required fields.");
      return;
    }

    const email = form.elements.email.value.trim();

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      form.elements.email.classList.add("error");
      showError("Please enter a valid email address.");
      return;
  }
    const phoneNumber = getNigerianPhoneNumber();

    if (!phoneNumber) {
      phoneGroup.classList.add("error");
      showError("Please enter a valid Nigerian mobile number, e.g. 08012345678.");
      return;
    }

    if (!paymentInput.value) {
      paymentTrigger.classList.add("error");
      showError("Please select a payment method.");
      paymentTrigger.focus();
      return;
    }

    if (form.elements.password.value.length < 8) {form.elements.password.classList.add("error");
      showError("Password must contain at least 8 characters.");
      return;
    }

    if (
      form.elements.password.value !==
      form.elements.retypePassword.value
    ) {
      form.elements.retypePassword.classList.add("error");
      showError("Your passwords do not match.");
      return;
  }
    const customerData = {
      firstName: form.elements.firstName.value.trim(),
      lastName: form.elements.lastName.value.trim(),
      email: email,
      state: form.elements.state.value,
      phone: phoneNumber,
      platform: form.elements.platform.value,
      paymentMethod: paymentInput.value,
      plan: plan,
      price: plans[plan],
      password: form.elements.password.value
    };

    submitBtn.disabled = true;
    submitBtn.textContent = "Processing...";
    try {
      const response = await fetch("/api/create-checkout", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(customerData)
      });

      const result = await response.json();

      if (!response.ok || !result.paymentUrl) {
        throw new Error(
          result.message || "Unable to create payment session."
        );
      }

      const paymentUrl = new URL(
        result.paymentUrl,
        window.location.origin
      );
      if (paymentUrl.origin !== window.location.origin) {
        throw new Error("Invalid payment redirect.");
      }

      window.location.href = paymentUrl.href;

    } catch (error) {
      showError(
        error.message || "Something went wrong. Please try again."
      );

      submitBtn.disabled = false;
      submitBtn.textContent = "Continue to Payment";
    }
  });
</script>

</body>
</html>
