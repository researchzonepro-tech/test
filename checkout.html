<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d09">
  <title>Checkout - Nairafunded</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/css/intlTelInput.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --primary: #080d09;
      --accent: #39FF14;
      --dark-green: #008F11;
      --white: #ffffff;
      --text: #e5e5e5;
      --input-bg: #111a13;
      --border: #263b29;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      min-height: 100%;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--primary);
      color: var(--white);
      font-family: 'Poppins', Arial, sans-serif;
      padding: 14px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    .form-container {
      width: 100%;
      max-width: 420px;
      background: #101711;
      padding: 19px;
      margin: auto;
      border-radius: 13px;
      border: 1px solid rgba(57,255,20,0.2);
      box-shadow: 0 0 25px rgba(57,255,20,0.07);
    }

    .brand {
      text-align: center;
      margin-bottom: 17px;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.3;
    }

    .brand .naira {
      color: white;
    }

    .brand .funded {
      color: var(--accent);
    }

    .brand-subtitle {
      text-align: center;
      color: #999;
      font-size: 9px;
      letter-spacing: 1.6px;
      margin-top: -13px;
      margin-bottom: 16px;
    }

    .plan-summary {
      background: #111f14;
      border: 1px solid var(--dark-green);
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 13px;
      text-align: center;
    }

    .plan-summary h3 {
      color: var(--accent);
      margin-bottom: 4px;
      font-size: 17px;
    }

    .plan-price {
      font-size: 23px;
      font-weight: bold;
      color: white;
    }

    .form-label {
      display: block;
      color: #ddd;
      font-size: 11px;
      margin-top: 7px;
    }

    input, select {
      display: block;
      width: 100%;
      min-width: 0;
      height: 42px;
      padding: 9px 11px;
      margin: 5px 0 7px;
      background: var(--input-bg);
      color: white;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: .2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 7px rgba(57,255,20,.12);
    }

    input::placeholder {
      color: #999;
    }

    select option {
      background: #111a13;
      color: white;
    }

    .input-group {
      position: relative;
    }

    .input-group input {
      padding-right: 42px;
    }

    .toggle-password {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--accent);
      z-index: 2;
    }

    input.error, select.error {
      border-color: #ff4b4b !important;
    }

    .submit-btn {
      width: 100%;
      min-height: 44px;
      padding: 10px;
      margin-top: 12px;
      background: linear-gradient(45deg, var(--dark-green), var(--accent));
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: .2s;
    }

    .submit-btn:hover {
      box-shadow: 0 0 15px rgba(57,255,20,.25);
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .iti {
      width: 100%;
      margin: 5px 0 7px;
    }

    .iti input {
      width: 100%;
      height: 42px;
      margin: 0;
    }

    .iti__country-list {
      background: #111a13;
      color: white;
      border: 1px solid var(--dark-green);
      max-width: min(300px, calc(100vw - 40px));
    }

    .iti__country:hover {
      background: #203525;
    }

    .iti__selected-country {
      background: #111a13;
    }

    .message {
      display: none;
      padding: 10px;
      margin-top: 10px;
      border-radius: 7px;
      font-size: 12px;
    }

    .message.error-message {
      display: block;
      background: #4a2020;
      color: #ffbaba;
    }

    .secure-note {
      text-align: center;
      font-size: 10px;
      color: #aaa;
      margin-top: 11px;
      line-height: 1.5;
    }

    .secure-note i {
      color: var(--accent);
      margin-right: 5px;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      color: var(--accent);
      font-size: 11px;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* Narrow phones */
    @media (max-width: 380px) {
      body {
        padding: 9px;
      }

      .form-container {
        padding: 14px;
        border-radius: 11px;
      }

      .brand {
        font-size: 22px;
        margin-bottom: 15px;
      }

      .plan-summary {
        padding: 10px;
        margin-bottom: 10px;
      }

      .plan-price {
        font-size: 21px;
      }

      input, select, .iti input {
        height: 40px;
        font-size: 12px;
      }

      .form-label {
        font-size: 10px;
      }
    }

    /* Short screens */
    @media (max-height: 700px) {
      body {
        padding-top: 8px;
        padding-bottom: 8px;
      }

      .form-container {
        padding-top: 13px;
        padding-bottom: 13px;
        margin-top: 0;
        margin-bottom: 0;
      }

      .brand {
        font-size: 22px;
        margin-bottom: 13px;
      }

      .brand-subtitle {
        margin-bottom: 12px;
      }

      .plan-summary {
        padding: 9px;
        margin-bottom: 9px;
      }

      .form-label {
        margin-top: 5px;
      }

      input, select, .iti input {
        height: 39px;
        margin-top: 4px;
        margin-bottom: 5px;
      }

      .submit-btn {
        margin-top: 9px;
      }

      .secure-note {
        margin-top: 8px;
      }

      .back-link {
        margin-top: 9px;
      }
    }
  </style>
</head>

<body>

<div class="form-container">

  <div class="brand">
    <span class="naira">Naira</span><span class="funded">funded</span>
  </div>

  <p class="brand-subtitle">TRADE • GROW • GET FUNDED</p>

  <div class="plan-summary">
    <h3 id="planTitle">Selected Plan</h3>
    <p class="plan-price" id="planPrice">Loading price...</p>
  </div>

  <form id="checkoutForm" novalidate>

    <label class="form-label">First Name</label>
    <input type="text" name="firstName" placeholder="Enter first name" autocomplete="given-name" required>

    <label class="form-label">Last Name</label>
    <input type="text" name="lastName" placeholder="Enter last name" autocomplete="family-name" required>

    <label class="form-label">Email Address</label>
    <input type="email" name="email" placeholder="Enter email address" autocomplete="email" required>

    <label class="form-label">Country</label>
    <select id="country" name="country" required>
      <option value="">Select Country</option>
      <option value="US">United States</option>
      <option value="GB">United Kingdom</option>
      <option value="CA">Canada</option>
      <option value="NG">Nigeria</option>
      <option value="IN">India</option>
      <option value="DE">Germany</option>
      <option value="FR">France</option>
      <option value="ZA">South Africa</option>
      <option value="BR">Brazil</option>
      <option value="PH">Philippines</option>
      <option value="PK">Pakistan</option>
      <option value="AU">Australia</option>
    </select>

    <label class="form-label">Phone Number</label>
    <input id="phone" type="tel" name="phone" placeholder="Enter phone number" autocomplete="tel" required>

    <label class="form-label">Trading Platform</label>
    <select id="platform" name="platform" required>
      <option value="">Select Platform</option>
      <option value="metatrader5">MetaTrader 5</option>
      <option value="metatrader4">MetaTrader 4</option>
      <option value="marchtrader">MarchTrader</option>
    </select>

    <label class="form-label">Payment Network</label>
    <select id="blockchainSelect" name="blockchain" required>
      <option value="">Select Network</option>
      <option value="bsc">BSC (BEP20)</option>
      <option value="trc20">TRC20</option>
      <option value="ethereum">Ethereum (ERC20)</option>
    </select>

    <label class="form-label">Create Password</label>
    <div class="input-group">
      <input type="password" name="password" id="password"
        placeholder="Create password (minimum 8 characters)"
        minlength="8" autocomplete="new-password" required>
      <i class="fa-solid fa-eye toggle-password"
        onclick="togglePassword('password', this)"></i>
    </div>

    <label class="form-label">Confirm Password</label>
    <div class="input-group">
      <input type="password" name="retypePassword" id="retypePassword"
        placeholder="Confirm your password"
        minlength="8" autocomplete="new-password" required>
      <i class="fa-solid fa-eye toggle-password"
        onclick="togglePassword('retypePassword', this)"></i>
    </div>

    <div id="message" class="message"></div>

    <button type="submit" class="submit-btn" id="submitBtn">
      Continue to Crypto Payment
    </button>

    <p class="secure-note">
      <i class="fa-solid fa-lock"></i>
      Your information should be securely processed.
    </p>

    <a href="main.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Homepage
    </a>

  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/intlTelInput.min.js"></script>

<script>
  const plans = {
    "50K Plan": 5000,
    "100K Plan": 8000,
    "200K Plan": 12000,
    "500K Plan": 28000,
    "1M Plan": 50000
  };

  const params = new URLSearchParams(window.location.search);
  const plan = params.get("plan");

  const planTitle = document.getElementById("planTitle");
  const planPrice = document.getElementById("planPrice");
  const form = document.getElementById("checkoutForm");
  const message = document.getElementById("message");
  const submitBtn = document.getElementById("submitBtn");

  const validPlan = Object.prototype.hasOwnProperty.call(plans, plan);

  if (!validPlan) {
    planTitle.textContent = "Invalid Plan";
    planPrice.textContent = "Please select a valid plan.";
    submitBtn.disabled = true;
  } else {
    planTitle.textContent = plan;
    planPrice.textContent = "₦" + plans[plan].toLocaleString("en-NG");
  }

  const phoneInput = document.getElementById("phone");
  const countrySelect = document.getElementById("country");

  const iti = window.intlTelInput(phoneInput, {
    separateDialCode: true,
    initialCountry: "ng",
    nationalMode: false,
    allowDropdown: true,
    utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/utils.js"
  });

  countrySelect.addEventListener("change", function() {
    if (this.value) {
      iti.setCountry(this.value.toLowerCase());
    }
  });

  form.querySelectorAll("input, select").forEach(field => {
    field.addEventListener("input", () => {
      field.classList.remove("error");
      message.className = "message";
      message.textContent = "";
    });

    field.addEventListener("change", () => {
      field.classList.remove("error");
    });
  });

  function togglePassword(id, icon) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
    icon.classList.toggle("fa-eye");
    icon.classList.toggle("fa-eye-slash");
  }

  function showError(text) {
    message.textContent = text;
    message.className = "message error-message";
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (!validPlan) {
      showError("Invalid plan. Please select a plan again.");
      return;
    }

    let valid = true;

    const fields = form.querySelectorAll("input:not([type=hidden]), select");

    fields.forEach(field => {
      if (!field.value.trim()) {
        field.classList.add("error");
        valid = false;
      } else {
        field.classList.remove("error");
      }
    });

    if (!valid) {
      showError("Please complete all required fields.");
      return;
    }

    const email = form.elements.email.value.trim();

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      form.elements.email.classList.add("error");
      showError("Please enter a valid email address.");
      return;
    }

    if (form.elements.password.value.length < 8) {
      form.elements.password.classList.add("error");
      showError("Password must contain at least 8 characters.");
      return;
    }

    if (form.elements.password.value !== form.elements.retypePassword.value) {
      form.elements.retypePassword.classList.add("error");
      showError("Your passwords do not match.");
      return;
    }

    if (!iti.isValidNumber()) {
      phoneInput.classList.add("error");
      showError("Please enter a valid phone number.");
      return;
    }

    const customerData = {
      firstName: form.elements.firstName.value.trim(),
      lastName: form.elements.lastName.value.trim(),
      email: email,
      country: countrySelect.value,
      phone: iti.getNumber(),
      platform: form.elements.platform.value,
      blockchain: form.elements.blockchain.value,
      plan: plan
    };

    submitBtn.disabled = true;
    submitBtn.textContent = "Processing...";

    try {
      const response = await fetch("/api/create-checkout", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          ...customerData,
          password: form.elements.password.value
        })
      });

      const result = await response.json();

      if (!response.ok || !result.paymentUrl) {
        throw new Error(result.message || "Unable to create payment session.");
      }

      const paymentUrl = new URL(result.paymentUrl, window.location.origin);

      if (paymentUrl.origin !== window.location.origin) {
        throw new Error("Invalid payment redirect.");
      }

      window.location.href = paymentUrl.href;

    } catch (error) {
      showError(error.message || "Something went wrong. Please try again.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Continue to Crypto Payment";
    }
  });
</script>

</body>
    </html>
